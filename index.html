<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2d2d31">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CRUSHED TETROMINO — ДШВ</title>
<style>
:root{
  color-scheme:dark;
  --bg:#2d2d31;--panel:#39373c;--panel2:#302f33;--border:#64444a;
  --burgundy:#78121B;--red:#B52A37;--white:#f7f0f1;--muted:#c3b6ba;
  --lit:#ffe17b;--cell:min(29px,calc((100vw - 22px) / 15),calc((100dvh - 245px) / 20));
  --button-d:clamp(49px,calc((100vw - 24px)/5.9),70px);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#2d2d31;color:var(--white);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,a{font:inherit;touch-action:manipulation}
button{color:inherit;cursor:pointer}
button:disabled{opacity:.38;cursor:default}
a:focus-visible,button:focus-visible{outline:2px solid #ffde9c;outline-offset:3px}
.shell{height:100%;height:100dvh;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 7px calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column;gap:9px}
.info{border:1px solid #67494c;background:linear-gradient(110deg,#4c4145,#353438 65%);border-radius:15px;padding:9px 12px;min-height:72px;max-height:112px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:inset 4px 0 #78121b}
.slogan{text-align:left;font-weight:850;font-size:clamp(13px,3.85vw,19px);line-height:1.14;letter-spacing:.025em;text-wrap:balance;flex:1 1 auto}
.social{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#f6eded;background:#641e29;border:1px solid #98505a;text-decoration:none}
.social:active{transform:scale(.95);background:#98303e}
.social svg{width:19px;height:19px}
.overlay-socials{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0 4px}
#pause{background:#641e29;color:#fff;border:1px solid #98505a;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:750;width:32px;height:32px;border-radius:50%;flex:0 0 auto}
.game-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:6px;align-items:start;width:100%;min-height:0;flex:0 0 auto}
.board-column{min-width:0;display:flex;align-items:flex-start;justify-content:flex-start}
.board-wrap{position:relative;flex:none;overflow:hidden;width:calc(var(--cell)*10 + 4px);height:calc(var(--cell)*20 + 4px);border:2px solid #8a414b;background:#18191d;border-radius:6px;box-shadow:inset 0 0 16px rgba(0,0,0,.4)}
#board{width:calc(var(--cell)*10);height:calc(var(--cell)*20);display:block;touch-action:none}
.side{min-width:0;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.7vh,15px);background:linear-gradient(180deg,#3c3a3f,#343338);border:1px solid #654950;border-radius:9px;padding:clamp(8px,1.3vh,12px) 3px 11px;min-height:calc(var(--cell)*20 + 4px)}
.readout{width:100%;display:flex;flex-direction:column;align-items:center;gap:5px}
.lcd-number{display:inline-flex;align-items:center;justify-content:center;gap:var(--lcd-gap,1px);min-height:var(--lcd-height,23px);color:var(--lit);line-height:1;white-space:nowrap;font-size:0}
.lcd-number svg{width:var(--lcd-width,12px);height:var(--lcd-height,23px);flex:0 0 auto;display:block}
.lcd-number .lit{fill:currentColor;filter:drop-shadow(0 0 1px rgba(255,209,72,.6))}
.lcd-number .dim{fill:#8d8386;opacity:.13}
.lcd-number svg.is-leading .lit{fill:#7f777a;filter:none}
#score,#best{--lcd-width:clamp(8px,calc(var(--cell)*.52),15px);--lcd-height:clamp(18px,calc(var(--cell)*1.02),29px);--lcd-gap:1px}
#speed,#level{--lcd-width:clamp(13px,calc(var(--cell)*.67),18px);--lcd-height:clamp(23px,calc(var(--cell)*1.25),34px);--lcd-gap:2px}
.matrix-word{height:clamp(9px,calc(var(--cell)*.56),14px);max-width:100%;width:auto;fill:#c9b8bc;image-rendering:pixelated;display:block}
.matrix-caption{display:flex;align-items:center;justify-content:center;width:100%;margin-bottom:3px}
.preview-shell{width:calc(var(--cell)*4 + 8px);height:calc(var(--cell)*4 + 8px);display:grid;place-items:center;border:1px solid #73575d;border-radius:5px;background:#242327;max-width:100%}
#next{width:calc(var(--cell)*4);height:calc(var(--cell)*4);display:block;max-width:100%}
.hud-divider{height:1px;width:82%;background:#65565a;opacity:.65}
.booster-mini{width:92%;border:1px solid #934c56;border-radius:9px;background:linear-gradient(145deg,#8b2836,#6b1b27);display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:center;min-height:45px;padding:5px 3px}
.booster-line{display:flex;align-items:center;justify-content:center;gap:7px;font-size:18px;font-weight:800;line-height:1}
#energy{--lcd-width:7px;--lcd-height:13px;--lcd-gap:0px;color:#ffe17b}
.energy-bar{height:4px;background:#4c292f;width:90%;border-radius:10px;overflow:hidden}
.energy-fill{height:100%;background:#ffcc68;width:100%;transition:width .2s ease}
.controls{margin-top:auto;width:100%;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:center;gap:6px;flex:0 0 auto;padding:0 2px;min-height:calc(var(--button-d)*2 + 8px)}
.controls-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:100%}
.direction-row{width:min(100%,calc(var(--button-d)*2 + 32px));display:flex;justify-content:space-between;gap:22px}
.ctrl{border-radius:50%;width:var(--button-d);height:var(--button-d);padding:0;background:radial-gradient(circle at 35% 20%,#a23745,#78121b 72%);border:2px solid #c66d7a;box-shadow:inset 0 -5px 0 rgba(27,0,6,.26),0 4px 8px rgba(0,0,0,.24);display:flex;align-items:center;justify-content:center;color:#f9eff1;touch-action:none;flex:none}
.ctrl svg{width:46%;height:46%}
.ctrl.left svg{transform:rotate(180deg)}
.ctrl.down svg{transform:rotate(90deg)}
.ctrl:active,.ctrl.pressed{transform:translateY(2px);background:#ab3545;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.controls-right{display:flex;align-items:center;justify-content:center;min-width:0}
#rotate{width:calc(var(--button-d)*1.414);height:calc(var(--button-d)*1.414);background:radial-gradient(circle at 40% 20%,#e04858,#a32332 78%);border-color:#eb7985}
#rotate svg{width:51%;height:51%}
.overlay{position:absolute;inset:0;z-index:10;background:rgba(23,22,26,.93);display:flex;align-items:center;justify-content:center;text-align:center;padding:9px;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.overlay-inner{width:100%;max-width:210px;max-height:100%;overflow:auto;scrollbar-width:none}
.overlay .tag{font-size:10px;color:#ffd58f;letter-spacing:.08em;font-weight:850}
.overlay h1{font-size:clamp(18px,5.5vw,27px);margin:7px 0 9px;line-height:1.08}
.overlay p{font-size:clamp(10px,2.7vw,12px);color:#d7ccce;line-height:1.45;margin:0 0 14px}
.start{background:#b92b3a;border:1px solid #e45e6d;border-radius:13px;color:#fff;font-weight:850;font-size:14px;min-height:41px;padding:9px 12px;max-width:100%}
.overlay .extra{font-size:9px;color:#a99b9d;margin-top:11px;line-height:1.25}
@media(min-width:530px){:root{--cell:min(29px,calc((100dvh - 245px)/20))} .info{justify-content:space-between;padding:11px 20px;min-height:74px}.slogan{text-align:left}.shell{max-width:490px}.game-row{justify-content:center}}
@media(max-height:690px){
 :root{--cell:min(29px,calc((100vw - 22px)/15),calc((100dvh - 204px)/20));--button-d:clamp(45px,calc((100dvh - 500px)*.2 + 43px),56px)}
 .shell{gap:5px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 3px)}
 .info{min-height:61px;padding:6px 8px;gap:6px}.slogan{font-size:clamp(12px,3.4vw,15px)}.social{width:25px;height:25px}.social svg{width:16px;height:16px}.overlay-socials{gap:9px;margin:10px 0 2px}#pause{width:25px;height:25px;font-size:15px}
 .side{gap:5px;padding:6px 2px;min-height:calc(var(--cell)*20 + 4px)}.readout{gap:2px}.hud-divider{height:1px}.matrix-caption{margin-bottom:0}.booster-mini{min-height:36px;padding:3px 2px}.booster-line{font-size:14px}.energy-bar{height:3px}
 .controls{min-height:calc(var(--button-d)*2 + 4px)}.controls-left{gap:4px}
}
@media(max-width:350px){.shell{padding-left:5px;padding-right:5px}.game-row{gap:4px}.side{padding-left:1px;padding-right:1px}.preview-shell{width:calc(var(--cell)*4 + 4px);height:calc(var(--cell)*4 + 4px)}.slogan{letter-spacing:0}.ctrl{border-width:1.5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 y="0" width="1" height="1"/><rect x="18" y="1" width="1" height="1"/><rect x="18" y="2" width="1" height="1"/><rect x="18" y="3" width="1" height="1"/><rect x="19" y="3" width="1" height="1"/><rect x="20" y="3" width="1" height="1"/><rect x="21" y="3" width="1" height="1"/><rect x="18" y="4" width="1" height="1"/><rect x="18" y="5" width="1" height="1"/><rect x="18" y="6" width="1" height="1"/><rect x="19" y="6" width="1" height="1"/><rect x="20" y="6" width="1" height="1"/><rect x="21" y="6" width="1" height="1"/><rect x="22" y="6" width="1" height="1"/><rect x="24" y="0" width="1" height="1"/><rect x="24" y="1" width="1" height="1"/><rect x="24" y="2" width="1" height="1"/><rect x="24" y="3" width="1" height="1"/><rect x="24" y="4" width="1" height="1"/><rect x="24" y="5" width="1" height="1"/><rect x="24" y="6" width="1" height="1"/><rect x="25" y="6" width="1" height="1"/><rect x="26" y="6" width="1" height="1"/><rect x="27" y="6" width="1" height="1"/><rect x="28" y="6" width="1" height="1"/></svg></div><div id="level" class="lcd-number" aria-label="Рівень">01</div></div>

  <script>
  (() => {
    'use strict';
    const COLS=10, ROWS=20, POWER_COST=100;
    const COLORS={I:'#52d8e6',O:'#f4cc63',T:'#ae84f1',S:'#64d69b',Z:'#ef7183',J:'#6c9dea',L:'#efaa62'};
    // Optimized sprite atlas: 28 tiles of 128×128 arranged in 4 columns × 7 rows. Original: atlas_master.png (not loaded by game).
    // Tile index follows each piece's SHAPES point order and survives row removal.
    const TILE_ATLAS={"S":[[0,384],[128,384],[256,384],[384,384]],"Z":[[0,512],[128,512],[256,512],[384,512]],"J":[[0,640],[128,640],[256,640],[384,640]],"L":[[0,768],[128,768],[256,768],[384,768]],"T":[[0,256],[128,256],[256,256],[384,256]],"I":[[0,0],[128,0],[256,0],[384,0]],"O":[[0,128],[128,128],[256,128],[384,128]]};
    const ART_CELL_SIZE=128;
    const spriteAtlas=new Image();
    let spriteAtlasReady=false;
    spriteAtlas.onload=()=>{spriteAtlasReady=true;drawNext();draw();};
    spriteAtlas.onerror=()=>{spriteAtlasReady=false;console.warn('CRUSHED TETROMINO: atlas not available; using color fallback.');};
    spriteAtlas.src='./atlas.png';
    const SHAPES={
      I:[[0,1],[1,1],[2,1],[3,1]],
      O:[[1,0],[2,0],[1,1],[2,1]],
      T:[[1,0],[0,1],[1,1],[2,1]],
      S:[[1,0],[2,0],[0,1],[1,1]],
      Z:[[0,0],[1,0],[1,1],[2,1]],
      J:[[0,0],[0,1],[1,1],[2,1]],
      L:[[2,0],[0,1],[1,1],[2,1]]
    };
    const $=s=>document.getElementById(s);
    // Genuine seven-segment shapes. Digits stay readable offline without loading any fonts.
    const LCD_SEGMENTS={
      a:'6,2 22,2 19,6 9,6',
      b:'23,3 26,7 26,22 23,25 21,22 21,9',
      c:'23,26 26,29 26,44 23,48 21,40 21,29',
      d:'6,48 22,48 19,44 9,44',
      e:'2,26 6,29 6,40 3,48 1,44 1,29',
      f:'2,3 6,9 6,21 3,25 1,22 1,7',
      g:'6,25 9,22 19,22 22,25 19,28 9,28'
    };
    const LCD_MAP={
      '0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc',
      '5':'afgcd','6':'afgecd','7':'abc','8':'abcdefg','9':'abfgcd'
    };
    const SVG_NS='http://www.w3.org/2000/svg';
    const lastLCD={};
    function renderLCD(id,value){
      const el=$(id); if(!el)return;
      const raw=String(Math.max(0,Math.trunc(Number(value)||0)));
      const places=({score:6,best:6,speed:2,level:2,energy:3})[id]||raw.length;
      const display=raw.padStart(places,'0');
      if(lastLCD[id]===display)return;
      lastLCD[id]=display;
      const hasNumber=Number(raw)>0;
      const firstBright=hasNumber? display.length-raw.length : display.length;
      const fragment=document.createDocumentFragment();
      for(let index=0;index<display.length;index++){
        const digit=display[index];
        const svg=document.createElementNS(SVG_NS,'svg');
        svg.setAttribute('viewBox','0 0 28 50');
        svg.setAttribute('aria-hidden','true');
        if(index<firstBright)svg.classList.add('is-leading');
        const lit=LCD_MAP[digit]||'';
        for(const [key,coords] of Object.entries(LCD_SEGMENTS)){
          const poly=document.createElementNS(SVG_NS,'polygon');
          poly.setAttribute('points',coords);
          poly.setAttribute('class',lit.includes(key)?'lit':'dim');
          svg.appendChild(poly);
        }
        fragment.appendChild(svg);
      }
      el.replaceChildren(fragment);
      el.setAttribute('role','img');
      el.setAttribute('aria-label',display);
      el.setAttribute('data-number',display);
      el.setAttribute('data-value',raw);
    }

    const canvas=$('board'),ctx=canvas.getContext('2d');
    const nextCanvas=$('next'),nctx=nextCanvas.getContext('2d');
    let grid,active,bag=[],preview,score=0,lines=0,level=1,energy=100,best=0;
    let state='intro',lastTime=0,fallAccumulator=0,frameId=0;
    let touchStart=null;
    try{best=Number(localStorage.getItem('stack_best_v1'))||0;}catch(e){}
    renderLCD('best',best);
    $('overlay-socials').hidden=false;

    function emptyGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(null));}
    function nextType(){
      if(!bag.length){bag=Object.keys(SHAPES);
        for(let i=bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
      }
      return bag.pop();
    }
    function piece(type){return {type,points:SHAPES[type].map(([x,y])=>[x,y]),x:3,y:-1,rot:0};}
    function collide(p,dx=0,dy=0,points=p.points){
      return points.some(([cx,cy])=>{
        let x=p.x+cx+dx,y=p.y+cy+dy;
        return x<0||x>=COLS||y>=ROWS||(y>=0&&grid[y][x]);
      });
    }
    function spawn(){
      active=piece(preview);preview=nextType();drawNext();
      if(collide(active)){finish();}
    }
    function start(){
      grid=emptyGrid();bag=[];preview=nextType();score=0;lines=0;level=1;energy=100;fallAccumulator=0;
      state='playing';$('overlay').classList.add('hidden');
      spawn();updateHud();draw();
      lastTime=performance.now();
      cancelAnimationFrame(frameId);frameId=requestAnimationFrame(tick);
    }
    function updateHud(){
      renderLCD('score',score);renderLCD('level',level);
      renderLCD('speed',level);renderLCD('energy',energy);
      $('energy-fill').style.width=energy+'%';
      $('laser').disabled=state!=='playing'||energy<POWER_COST||!grid.some(row=>row.some(Boolean));
      $('pause').textContent=state==='paused'?'▶':'Ⅱ';
    }
    function move(dx,dy){
      if(state!=='playing')return false;
      if(!collide(active,dx,dy)){active.x+=dx;active.y+=dy;draw();return true;}
      return false;
    }
    function rotate(){
      if(state!=='playing')return;
      if(active.type==='O')return;
      const span=active.type==='I'?4:3;
      const rotated=active.points.map(([x,y])=>[span-1-y,x]);
      for(const shift of [0,-1,1,-2,2]){
        if(!collide(active,shift,0,rotated)){
          active.x+=shift;active.points=rotated;active.rot=(active.rot+1)%4;draw();return;
        }
      }
    }
    function lock(){
      let out=false;
      for(let i=0;i<active.points.length;i++){
        const [cx,cy]=active.points[i];let x=active.x+cx,y=active.y+cy;
        if(y<0){out=true;continue;}
        // Keep which original graphic tile this cell is, even after a row clears.
        grid[y][x]={type:active.type,tile:i,rot:active.rot};
      }
      if(out){finish();return;}
      let cleared=0;
      for(let y=ROWS-1;y>=0;y--){
        if(grid[y].every(Boolean)){
          grid.splice(y,1);grid.unshift(Array(COLS).fill(null));cleared++;y++;
        }
      }
      if(cleared){
        score+=[0,100,300,500,800][cleared]*level;
        lines+=cleared;energy=Math.min(100,energy+cleared*25);
        level=1+Math.floor(lines/10);
      }
      fallAccumulator=0;spawn();updateHud();draw();
    }
    function softDrop(){if(state!=='playing')return; if(!move(0,1))lock();else{score+=1;updateHud();}}
    function hardDrop(){
      if(state!=='playing')return;
      let distance=0;while(!collide(active,0,1)){active.y++;distance++;}
      score+=distance*2;lock();
    }
    function laser(){
      if(state!=='playing'||energy<POWER_COST)return;
      let row=-1;
      for(let y=ROWS-1;y>=0;y--)if(grid[y].some(Boolean)){row=y;break;}
      if(row<0)return;
      grid.splice(row,1);grid.unshift(Array(COLS).fill(null));
      energy-=POWER_COST;
      // The falling piece remains in place; if the row shift overlaps it, lift it safely.
      if(collide(active)){
        for(let lift=1;lift<=4;lift++){
          if(!collide(active,0,-lift)){active.y-=lift;break;}
        }
      }
      updateHud();draw();
    }
    function finish(){
      state='over';
      if(score>best){best=score;try{localStorage.setItem('stack_best_v1',String(best));}catch(e){}}
      renderLCD('best',best);
    $('overlay-socials').hidden=false;
      showOverlay('КІНЕЦЬ ГРИ','Гру завершено',`Твій результат: ${score.toLocaleString('uk-UA')} очок. Зібрано ліній: ${lines}.`,'Зіграти ще','Ти можеш покращити рекорд',true);
      updateHud();
    }
    function showOverlay(tag,title,message,action,extra,showSocials=true){
      $('overlay-tag').textContent=tag;$('overlay-title').textContent=title;
      $('overlay-message').textContent=message;$('overlay-action').textContent=action;
      $('overlay-extra').textContent=extra;
      $('overlay-socials').hidden=!showSocials;
      $('overlay').classList.remove('hidden');
    }
    function pause(){
      if(state==='playing'){
        state='paused';showOverlay('ПАУЗА','Перерва','Фігура зачекає. Продовжимо, коли будеш готовий.','Продовжити','Пауза не впливає на рахунок',false);
      }else if(state==='paused'){
        state='playing';$('overlay').classList.add('hidden');lastTime=performance.now();
        cancelAnimationFrame(frameId);frameId=requestAnimationFrame(tick);
      }
      updateHud();
    }
    function tick(now){
      if(state!=='playing')return;
      const dt=Math.min(60,now-lastTime);lastTime=now;fallAccumulator+=dt;
      const interval=Math.max(85,800*Math.pow(.82,level-1));
      if(fallAccumulator>=interval){fallAccumulator=0;if(!move(0,1))lock();}
      draw();frameId=requestAnimationFrame(tick);
    }
    function setupCanvas(el,c,w,h){
      const dpr=Math.min(devicePixelRatio||1,3);
      el.width=Math.round(w*dpr);el.height=Math.round(h*dpr);
      c.setTransform(dpr,0,0,dpr,0,0);
    }
    let cw=260,ch=520,unit=26;
    function resize(){
      const rect=canvas.getBoundingClientRect();cw=rect.width;ch=rect.height;unit=cw/COLS;
      if(cw>0){const pw=nextCanvas.getBoundingClientRect().width;setupCanvas(canvas,ctx,cw,ch);setupCanvas(nextCanvas,nctx,pw,pw);drawNext();draw();}
    }
    function square(c,x,y,size,color,alpha=1){
      const pad=Math.max(.8,size*.055);c.globalAlpha=alpha;
      c.fillStyle=color;c.fillRect(x+pad,y+pad,size-2*pad,size-2*pad);
      c.fillStyle='rgba(255,255,255,.2)';c.fillRect(x+pad+1,y+pad+1,size-2*pad-2,Math.max(1,size*.09));
      c.fillStyle='rgba(0,0,0,.13)';c.fillRect(x+pad+1,y+size-pad-3,size-2*pad-2,2);
      c.globalAlpha=1;
    }
    // Individual segments rotate together with their tetromino. Each settled
    // cell keeps its own atlas rect and final orientation after line removal.
    function drawCell(c,x,y,size,cell){
      const type=typeof cell==='string'?cell:cell.type;
      const tile=typeof cell==='object'&&cell!==null?cell.tile:undefined;
      const rot=typeof cell==='object'&&cell!==null?(cell.rot||0):0;
      const source=TILE_ATLAS[type]&&TILE_ATLAS[type][tile];
      if(spriteAtlasReady&&source){
        c.save();
        c.translate(x+size/2,y+size/2);
        c.rotate(rot*Math.PI/2);
        c.drawImage(spriteAtlas,source[0],source[1],ART_CELL_SIZE,ART_CELL_SIZE,-size/2,-size/2,size,size);
        c.restore();
      }else{
        square(c,x,y,size,COLORS[type]||'#b83b47');
      }
    }
    function draw(){
      if(!ctx||!grid||!unit)return;
      ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#18191d';ctx.fillRect(0,0,cw,ch);
      ctx.strokeStyle='rgba(196,163,168,.11)';ctx.lineWidth=.7;ctx.beginPath();
      for(let x=1;x<COLS;x++){ctx.moveTo(x*unit,0);ctx.lineTo(x*unit,ch);}
      for(let y=1;y<ROWS;y++){ctx.moveTo(0,y*unit);ctx.lineTo(cw,y*unit);}ctx.stroke();
      for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
        if(grid[y][x])drawCell(ctx,x*unit,y*unit,unit,grid[y][x]);
      }
      if(active&&state!=='over'){
        let ghost=0;while(!collide(active,0,ghost+1))ghost++;
        for(const [x,y] of active.points){
          const gx=active.x+x,gy=active.y+y+ghost;
          if(gy>=0){ctx.strokeStyle=COLORS[active.type];ctx.globalAlpha=.43;ctx.lineWidth=1.4;ctx.strokeRect(gx*unit+3,gy*unit+3,unit-6,unit-6);ctx.globalAlpha=1;}
        }
        active.points.forEach(([x,y],i)=>{const px=active.x+x,py=active.y+y;
          if(py>=0)drawCell(ctx,px*unit,py*unit,unit,{type:active.type,tile:i,rot:active.rot});
        });
      }
    }
    function drawNext(){
      if(!nctx||!preview)return;
      const size=nextCanvas.getBoundingClientRect().width;
      if(size<=0)return;
      const ps=size/4;
      nctx.clearRect(0,0,size,size);
      nctx.fillStyle='#242327';nctx.fillRect(0,0,size,size);
      nctx.strokeStyle='rgba(255,255,255,.065)';nctx.lineWidth=.6;
      for(let k=1;k<4;k++){
        nctx.beginPath();nctx.moveTo(k*ps,0);nctx.lineTo(k*ps,size);
        nctx.moveTo(0,k*ps);nctx.lineTo(size,k*ps);nctx.stroke();
      }
      const pts=SHAPES[preview];
      const xx=pts.map(q=>q[0]),yy=pts.map(q=>q[1]);
      const minX=Math.min(...xx),maxX=Math.max(...xx),minY=Math.min(...yy),maxY=Math.max(...yy);
      const offX=(4-(maxX-minX+1))/2,offY=(4-(maxY-minY+1))/2;
      pts.forEach(([x,y],i)=>drawCell(nctx,(offX+x-minX)*ps,(offY+y-minY)*ps,ps,{type:preview,tile:i,rot:0}));
    }
    $('overlay-action').addEventListener('click',()=>{if(state==='paused')pause();else start();});
    $('pause').addEventListener('click',()=>{if(state==='playing'||state==='paused')pause();});
    $('rotate').addEventListener('click',rotate);
    $('drop').addEventListener('click',hardDrop);
    $('laser').addEventListener('click',laser);
    function repeatControl(id,action){
      const el=$(id);let timer=null,delay=null;
      function stop(){clearInterval(timer);clearTimeout(delay);timer=delay=null;el.classList.remove('pressed');}
      el.addEventListener('pointerdown',ev=>{ev.preventDefault();stop();el.classList.add('pressed');el.setPointerCapture(ev.pointerId);action();delay=setTimeout(()=>{timer=setInterval(action,85);},270);});
      el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop);
    }
    repeatControl('left',()=>move(-1,0));repeatControl('right',()=>move(1,0));
    canvas.addEventListener('pointerdown',ev=>{
      if(state!=='playing')return;ev.preventDefault();touchStart={x:ev.clientX,y:ev.clientY};
      canvas.setPointerCapture(ev.pointerId);
    });
    canvas.addEventListener('pointerup',ev=>{
      if(!touchStart||state!=='playing')return;ev.preventDefault();
      const dx=ev.clientX-touchStart.x,dy=ev.clientY-touchStart.y;touchStart=null;
      if(dy>45&&Math.abs(dy)>Math.abs(dx)*1.15){hardDrop();return;}
      if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)){
        const count=Math.min(8,Math.max(1,Math.round(Math.abs(dx)/Math.max(19,unit*.8))));
        for(let i=0;i<count;i++)move(Math.sign(dx),0);return;
      }
      if(Math.abs(dx)<16&&Math.abs(dy)<18)rotate();
    });
    canvas.addEventListener('pointercancel',()=>{touchStart=null;});
    document.addEventListener('keydown',ev=>{
      if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space'].includes(ev.code))ev.preventDefault();
      if(ev.repeat&&['Space','ArrowUp','KeyX','KeyB'].includes(ev.code))return;
      switch(ev.code){
        case'ArrowLeft':move(-1,0);break;
        case'ArrowRight':move(1,0);break;
        case'ArrowDown':softDrop();break;
        case'ArrowUp':case'KeyX':rotate();break;
        case'Space':hardDrop();break;
        case'KeyB':laser();break;
        case'KeyP':pause();break;
        case'Enter':if(state==='intro'||state==='over')start();else if(state==='paused')pause();break;
      }
    });
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause();});
    window.addEventListener('resize',resize);
    grid=emptyGrid();preview=nextType();active=piece(preview);
    updateHud();resize();
  })();
  </script>
</body></html>
